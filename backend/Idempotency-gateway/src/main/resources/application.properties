spring.application.name=idempotency-gateway
server.port=8080

# Simulated payment processing time (ms)
payment.processing-delay-ms=2000

# Developer's Choice: idempotency keys expire after this many seconds (default 24h)
idempotency.ttl-seconds=86400
# How often the evictor sweeps expired keys (ms)
idempotency.cleanup-interval-ms=60000
